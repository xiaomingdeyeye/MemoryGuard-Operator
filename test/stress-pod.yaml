# A test Pod that uses the `stress` tool to consume memory and trip the policy.
# memory limit is 100Mi; stress allocates ~90M, i.e. ~90% usage -> exceeds 80%.
apiVersion: v1
kind: Pod
metadata:
  name: memory-hog
  namespace: default
  labels:
    app: memory-hog
spec:
  containers:
  - name: stress
    image: polinux/stress
    imagePullPolicy: IfNotPresent
    command: ["stress"]
    args:
    - "--vm"
    - "1"
    - "--vm-bytes"
    - "90M"
    - "--vm-hang"
    - "0"
    - "--timeout"
    - "600s"
    resources:
      requests:
        memory: "50Mi"
      limits:
        memory: "100Mi"
  restartPolicy: Never
